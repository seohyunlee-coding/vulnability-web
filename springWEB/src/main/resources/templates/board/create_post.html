<div xmlns:th="http://www.thymeleaf.org" th:fragment="content">

    <main style="max-width:900px; margin:40px auto; padding:0 20px; font-family: 'Inter', sans-serif;">
      <h1 style="font-size:2rem; color:#1E3A8A; margin-bottom:20px;">Create Post</h1>

      <form th:action="@{/posts/create}" th:object="${post}" method="post" style="display:flex; flex-direction:column; gap:16px;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div>
          <label style="display:block; font-weight:600; margin-bottom:8px;">Title</label>
          <input type="text" th:field="*{title}"
                 style="width:100%; padding:12px 14px; border-radius:8px; border:1px solid #d1e7f5;" />
        </div>
        <div>
          <label style="display:block; font-weight:600; margin-bottom:8px;">Content</label>
          <textarea th:field="*{content}" rows="8" cols="60"
                    style="width:100%; padding:12px 14px; border-radius:8px; border:1px solid #d1e7f5;"></textarea>
        </div>
        <div>
          <button type="submit"
                  style="padding:12px 24px; background:#5DADE2; color:white; border:none; border-radius:10px; font-weight:700;">Submit</button>
        </div>
      </form>
    </main>

  </div>
