<div xmlns:th="http://www.thymeleaf.org" th:fragment="content">

    <main style="max-width:1000px; margin:40px auto; padding:0 20px; font-family: 'Inter', sans-serif;">
      <h1 style="font-size:2rem; color:#1E3A8A; margin-bottom:20px;">My Posts</h1>

      <div th:if="${posts == null or #lists.isEmpty(posts)}"
        style="color:#6B7280; padding:24px; border:1px dashed #AED6F1; border-radius:12px;">
        You have not written any posts yet.
      </div>

      <div
        style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:20px; margin-top:20px;">
        <div th:each="post : ${posts}"
          style="background:#F8FBFF; padding:18px; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,0.04);">
          <h3 th:text="${post.title}"
            style="color:#3498DB; margin-bottom:8px;">Title</h3>
          <div style="font-size:0.9rem; color:#374151;"><small>by
              <span th:text="${post.author}">me</span> - <span th:text="${post.createdAt}">date</span></small></div>
          <p th:text="${post.content}"
            style="margin-top:10px; color:#1E3A8A;">Content</p>
        </div>
      </div>

    </main>

  </div>
